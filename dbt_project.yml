
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'r6s_balance'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  r6s_balance:
    # Tablas normales (no transient): Para conservar Time Travel y Fail-safe
    +transient: false
    # Staging: renombrar y castear, 1:1 con Bronze.
    # Vistas: no ocupan espacio y siempre reflejan Bronze.
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['staging']
      ubisoft_r6s:
        +schema: ubisoft_r6s

    # Silver: limpieza, deduplicación y reglas de calidad.
    # Tablas: la deduplicación de 2M de filas no se repite en cada consulta.
    silver:
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['silver']
      ubisoft_r6s:
        +schema: ubisoft_r6s

    # Gold: modelo dimensional y marts de negocio.
    gold:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']

      # Lógica de apoyo que no se expone a negocio
      intermediate:
        +materialized: view
        +schema: intermediate

      # Dominio de negocio: balance del juego
      game_balance:
        +schema: game_balance
        +tags: ['game_balance']
        +grants:
          select: ['REPORTING_ROLE']
        +meta:
          owner: equipo-disenio-juego
    
seeds:
  r6s_balance:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    skill_rank_groups:
      +column_types:
        skill_rank_group: varchar(20)
        rank_order: integer
        is_ranked: boolean

vars:
  # operadores lanzados en la temporada del dataset (Velvet Shell, Y2S1)
  velvet_shell_operators: ['JACKAL', 'MIRA']
  # mínimo de rondas para considerar fiable el win rate de un operador
  min_player_rounds_for_balance: 1000
  # diferencia ( en % ) frente a la media del bando para marcar desequilibrio
  balance_threshold_pp: 2