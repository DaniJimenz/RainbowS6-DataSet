version: 2

models:
  - name: int_rounds__aggregated
    description: >
      Agrega Silver de jugador-ronda a ronda. Una fila = una ronda.
      Agrupa por todos los atributos de la ronda para comprobar que son
      coherentes entre jugadores: si no lo fueran, round_id se repetiría.
    columns:
      - name: round_id
        description: Clave de la ronda.
        data_tests:
          - unique
          - not_null