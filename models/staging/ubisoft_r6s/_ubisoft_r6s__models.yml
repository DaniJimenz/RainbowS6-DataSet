version: 2

models:
  - name: stg_ubisoft_r6s__player_rounds
    description: >
      Staging de player_rounds: columnas renombradas a nombres de negocio y
      convertidas a su tipo. 1:1 con Bronze: sin filtros ni deduplicación.

    columns:
      - name: match_date
        description: Fecha de la partida.
        data_tests:
          - not_null

      - name: match_id
        description: Identificador de la partida (texto). No es único por sí solo.

      - name: round_number
        description: Número de ronda dentro de la partida.

      - name: game_mode
        description: Modo de juego (SECURE_AREA, BOMB, HOSTAGE).

      - name: map_name
        description: Mapa.

      - name: objective_location
        description: Objetivo dentro del mapa; depende del modo de juego.

      - name: winning_role
        description: Bando que ganó la ronda (Attacker / Defender).

      - name: end_round_reason
        description: Motivo por el que terminó la ronda.

      - name: round_duration_seconds
        description: Duración de la ronda en segundos. Sin limpiar (hay valores anómalos).

      - name: skill_rank
        description: Rango del jugador. Incluye Unranked.

      - name: player_role
        description: Bando del jugador en la ronda (Attacker / Defender).

      - name: team_number
        description: Equipo del jugador (0 o 1).

      - name: operator_code
        description: Unidad y operador tal como vienen en origen (p. ej. GIGN-ROOK).

      - name: has_won
        description: True si el jugador ganó la ronda.
        data_tests:
          - not_null

      - name: kills
        description: Bajas conseguidas por el jugador en la ronda.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: is_dead
        description: True si el jugador murió en la ronda.
        data_tests:
          - not_null

      - name: source_file_name
        description: Fichero del stage del que viene la fila.

      - name: source_row_number
        description: Línea del fichero de origen.

      - name: loaded_at
        description: Momento de la carga en Bronze.